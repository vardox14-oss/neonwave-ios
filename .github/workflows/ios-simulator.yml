name: iPhone simulator for Appetize

on:
  workflow_dispatch:
  push:
    branches: ["codex/ios-browser-preview"]
    paths: ["ios/**", ".github/workflows/ios-simulator.yml"]

permissions:
  contents: read

concurrency:
  group: ios-simulator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the native iPhone project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build the real SwiftUI app for the ARM iOS Simulator
        env:
          NEONWAVE_API_URL: ${{ vars.NEONWAVE_API_URL }}
        run: |
          set -euo pipefail
          mkdir -p ios/build
          xcodebuild -version
          xcodebuild \
            -project ios/NeonWave.xcodeproj \
            -scheme NeonWave \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ${NEONWAVE_API_URL:+NEONWAVE_API_URL=$NEONWAVE_API_URL} \
            build 2>&1 | tee ios/build/xcodebuild.log

      - name: Compile the App Store code path with Xcode 26
        run: |
          set -euo pipefail
          XCODE_MAJOR=$(xcodebuild -version | awk 'NR==1 { split($2, version, "."); print version[1] }')
          if [ "$XCODE_MAJOR" -lt 26 ]; then
            echo "error: App Store uploads require Xcode 26 or newer."
            exit 1
          fi
          xcodebuild \
            -project ios/NeonWave.xcodeproj \
            -scheme NeonWave \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/DerivedData-Release \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM=CI0000000 \
            NEONWAVE_API_URL=https://api.ci.neonwave.app \
            NEONWAVE_PRIVACY_URL=https://neonwave.app/privacy \
            NEONWAVE_SUPPORT_URL=https://neonwave.app/support \
            build 2>&1 | tee ios/build/xcodebuild-release.log

      - name: Package the simulator app for Appetize
        run: |
          set -euo pipefail
          APP_PATH=ios/DerivedData/Build/Products/Debug-iphonesimulator/NeonWave.app
          test -d "$APP_PATH"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$APP_PATH" ios/build/NeonWave-iOS-Simulator.zip

      - name: Save the Appetize ZIP immediately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NeonWave-Appetize-ZIP
          path: ios/build/NeonWave-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 7

      - name: Build the real iOS IPA for Sideloadly
        run: |
          set -euo pipefail
          mkdir -p ios/DerivedData-Device
          xcodebuild \
            -project ios/NeonWave.xcodeproj \
            -scheme NeonWave \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/DerivedData-Device \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=CI0000000 \
            NEONWAVE_API_URL=https://easier-turbo-referred-component.trycloudflare.com \
            NEONWAVE_PRIVACY_URL=https://neonwave.app/privacy \
            NEONWAVE_SUPPORT_URL=https://neonwave.app/support \
            build 2>&1 | tee ios/build/xcodebuild-device.log

          DEVICE_APP=ios/DerivedData-Device/Build/Products/Release-iphoneos/NeonWave.app
          test -d "$DEVICE_APP"
          rm -rf ios/build/Payload
          mkdir -p ios/build/Payload
          cp -R "$DEVICE_APP" ios/build/Payload/
          cd ios/build
          zip -qr NeonWave.ipa Payload
          cd ../..

      - name: Save the Sideloadly IPA immediately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NeonWave-IPA
          path: ios/build/NeonWave.ipa
          if-no-files-found: error
          retention-days: 7


      - name: Select an available iPhone simulator
        id: device
        run: |
          set -euo pipefail
          xcrun simctl list devices available --json > ios/build/devices.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('ios/build/devices.json').read_text())
          phones = [device for runtime, devices in data['devices'].items()
                    if '.iOS-' in runtime for device in devices
                    if device.get('isAvailable') and device['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('No installed iPhone simulator was found.')
          device = phones[-1]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('udid=' + device['udid'] + '\n')
          print('Selected simulator: ' + device['name'])
          PY

      - name: Capture the redesigned welcome screen before tests
        continue-on-error: true
        env:
          SIMULATOR_ID: ${{ steps.device.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl shutdown all 2>/dev/null || true
          perl -e '$seconds=shift; alarm $seconds; exec @ARGV' 30 xcrun simctl boot "$SIMULATOR_ID"
          perl -e '$seconds=shift; alarm $seconds; exec @ARGV' 120 xcrun simctl bootstatus "$SIMULATOR_ID" -b
          perl -e '$seconds=shift; alarm $seconds; exec @ARGV' 60 xcrun simctl install "$SIMULATOR_ID" ios/DerivedData/Build/Products/Debug-iphonesimulator/NeonWave.app
          perl -e '$seconds=shift; alarm $seconds; exec @ARGV' 30 xcrun simctl launch --terminate-running-process "$SIMULATOR_ID" app.neonwave.ios
          sleep 5
          perl -e '$seconds=shift; alarm $seconds; exec @ARGV' 30 xcrun simctl io "$SIMULATOR_ID" screenshot ios/build/NeonWave-Premium-UI.png

      - name: Save the visual preview immediately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NeonWave-Premium-UI
          path: ios/build/NeonWave-Premium-UI.png
          if-no-files-found: warn
          retention-days: 7

      - name: Run the native library tests
        env:
          SIMULATOR_ID: ${{ steps.device.outputs.udid }}
          NEONWAVE_API_URL: ${{ vars.NEONWAVE_API_URL }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/NeonWave.xcodeproj \
            -scheme NeonWave \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath ios/DerivedData \
            -resultBundlePath ios/build/NeonWaveTests.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ${NEONWAVE_API_URL:+NEONWAVE_API_URL=$NEONWAVE_API_URL} \
            test 2>&1 | tee ios/build/tests.log

      - name: Capture the actual iPhone welcome screen
        continue-on-error: true
        env:
          SIMULATOR_ID: ${{ steps.device.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl shutdown all 2>/dev/null || true
          xcrun simctl boot "$SIMULATOR_ID"
          perl -e '$seconds=shift; alarm $seconds; exec @ARGV' 120 xcrun simctl bootstatus "$SIMULATOR_ID" -b
          perl -e '$seconds=shift; alarm $seconds; exec @ARGV' 60 xcrun simctl install "$SIMULATOR_ID" ios/DerivedData/Build/Products/Debug-iphonesimulator/NeonWave.app
          perl -e '$seconds=shift; alarm $seconds; exec @ARGV' 30 xcrun simctl launch --terminate-running-process "$SIMULATOR_ID" app.neonwave.ios
          sleep 5
          perl -e '$seconds=shift; alarm $seconds; exec @ARGV' 30 xcrun simctl io "$SIMULATOR_ID" screenshot ios/build/NeonWave-iPhone.png

      - name: Save the Appetize ZIP and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NeonWave-iOS-Simulator
          path: |
            ios/build/NeonWave-iOS-Simulator.zip
            ios/build/NeonWave-iPhone.png
            ios/build/xcodebuild.log
            ios/build/xcodebuild-release.log
            ios/build/tests.log
            ios/build/NeonWaveTests.xcresult
          if-no-files-found: warn
          retention-days: 7
